{% extends 'blog/base_template.html' %}
{% block content %}
<h2>Удалить комментарий?</h2>
<p>«{{ comment.content|truncatewords:10 }}...»</p>
<form method="post">
  {% csrf_token %}
  <button type="submit" class="btn btn-danger">Удалить</button>
  <a href="{% url 'post_detail' comment.post.id %}" class="btn btn-secondary" style="margin-left: 10px;">Отмена</a>
</form>
{% endblock %}
