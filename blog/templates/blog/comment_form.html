{% extends 'blog/base_template.html' %}
{% block content %}
<h2>Редактировать комментарий</h2>
<form method="post">
  {% csrf_token %}
  {{ form.content }}
  <div style="margin-top: 10px;">
    <button type="submit" class="btn btn-primary">Сохранить</button>
    <a href="{% url 'post_detail' comment.post.id %}" class="btn btn-secondary" style="margin-left: 10px;">Отмена</a>
  </div>
</form>
{% endblock %}
