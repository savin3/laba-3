{% extends 'base.html' %}
{% block content %}
<div class="form-card" style="max-width: 500px; margin: 40px auto; background: white; padding: 30px; border-radius: 14px; box-shadow: var(--shadow);">
    <h1 style="text-align: center; margin-bottom: 24px; color: var(--text-primary);">Регистрация</h1>
    <form method="post">
        {% csrf_token %}
        <div class="form-group">
            <label for="{{ form.username.id_for_label }}">Имя пользователя:</label>
            {{ form.username }}
        </div>
        <div class="form-group">
            <label for="{{ form.password1.id_for_label }}">Пароль:</label>
            {{ form.password1 }}
        </div>
        <div class="form-group">
            <label for="{{ form.password2.id_for_label }}">Подтверждение пароля:</label>
            {{ form.password2 }}
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%;">Зарегистрироваться</button>
    </form>
    <p style="text-align: center; margin-top: 20px;">
        Уже есть аккаунт? <a href="{% url 'login' %}" style="color: #007bff; text-decoration: underline;">Войти</a>
    </p>
</div>
{% endblock %}
